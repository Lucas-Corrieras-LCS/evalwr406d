# ============================================================
# Render Blueprint — WR406D TP VueJS
# Déploiement : Render.com > New > Blueprint > ce repo
# ============================================================

services:
  # ── Backend Symfony ───────────────────────────────────────
  - type: web
    name: evalwr406d-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: evalwr406d-db
          property: connectionString
      # Remplace par l'URL Render de ton frontend après premier déploiement
      - key: CORS_ALLOW_ORIGIN
        value: "^https://evalwr406d-frontend\\.onrender\\.com$"

  # ── Frontend Vue.js ───────────────────────────────────────
  - type: web
    name: evalwr406d-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Remplace par l'URL exacte du service evalwr406d-api après déploiement
      - key: VITE_API_URL
        value: https://evalwr406d-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Base de données PostgreSQL (gratuit 90 jours) ─────────
databases:
  - name: evalwr406d-db
    plan: free
    databaseName: evalwr406d
    user: evalwr406d_user
