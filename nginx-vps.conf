# ============================================================
# Config Nginx VPS pour le TP WR406D
# Copier dans /etc/nginx/sites-available/evalwr406d
# puis: ln -s /etc/nginx/sites-available/evalwr406d /etc/nginx/sites-enabled/
# puis: nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name monVPS;  # Remplacer par votre IP ou domaine
    root /var/www/html;

    # -------------------------------------------------------
    # Frontend Vue.js sur /travaux/evalwr406d
    # -------------------------------------------------------
    location /travaux/evalwr406d {
        alias /var/www/html/travaux/evalwr406d;
        index index.html;
        # SPA routing - tout renvoyer vers index.html
        try_files $uri $uri/ /travaux/evalwr406d/index.html;
    }

    # -------------------------------------------------------
    # API Symfony sur /api
    # -------------------------------------------------------
    location /api {
        root /var/www/evalwr406d-backend/public;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/evalwr406d-backend/public/index.php;
        include fastcgi_params;
    }
}
